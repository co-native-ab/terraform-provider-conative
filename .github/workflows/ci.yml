name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Check the dependency graph
        run: |
          # The provider never signs in, so nothing that does may be linked in, and the
          # test tooling must never end up in the provider binary.
          if go list -deps ./... | grep -E 'github\.com/(Azure|AzureAD)/'; then
            echo "A package that signs in to Microsoft Entra ID is in the dependency graph." >&2
            exit 1
          fi
          if go list -deps ./... | grep -E 'golang\.org/x/crypto/acme/autocert'; then
            echo "golang.org/x/crypto/acme/autocert is in the dependency graph." >&2
            exit 1
          fi
          if go list -deps . | grep -E '/internal/acctest'; then
            echo "Acceptance test tooling is linked into the provider binary." >&2
            exit 1
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  acceptance:
    name: Acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Pull the SQL Server image
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest
      - name: Run the acceptance tests
        run: TF_ACC=1 go test ./internal/provider/... -run TestAcc -timeout 30m -v

  docs:
    name: Documentation is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Regenerate the documentation
        run: go generate ./...
      - name: Fail if the generated documentation differs from what is committed
        run: |
          git add --intent-to-add --all
          git diff --exit-code

  ci-ok:
    name: ci-ok
    if: always()
    needs: [build, unit, acceptance, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job finished with: $result" >&2
              exit 1
            fi
          done
